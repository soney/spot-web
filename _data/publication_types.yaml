# Maps each venue type to its CV numbering prefix (e.g. the third-newest
# journal paper is J.<n>). Read by the cv_publication_codes filter in
# _plugins/cv_publication_codes.rb, which looks types up by name -- the order
# of this list does not matter. A venue type absent from this list gets no
# numbering code.
- type: journal
  prefix: J
- type: conference
  prefix: C
- type: bookchapter
  prefix: B
- type: poster
  prefix: P
- type: workshop
  prefix: W
- type: doctoralconsortium
  prefix: D
- type: demo
  prefix: E
- type: panel
  prefix: A
- type: preprint
  prefix: R
- type: thesis
  prefix: T
