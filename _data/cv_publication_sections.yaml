# each type live in publication_types.yaml.
- title: Heavily-reviewed Journal Manuscripts (J)
  types: [journal]
- title: Heavily-reviewed Conference Papers (C)
  types: [conference]
- title: Book Chapters (B)
  types: [bookchapter]
- title: >-
    Refereed Posters (P), Workshops (W), Doctoral Consortiums (D), Demos (E),
    and Panels (A)
