- id: simulating_human_cursor_trajectories_for_path_sensitive_gui_evaluation_2026
  title: Simulating Human Cursor Trajectories for Path-Sensitive GUI Evaluation
  doi: 10.1145/3772363.3798829
  abstract: >-
    User simulation models support predictive evaluation of interface designs by generating
    synthetic interaction behavior. While existing models can accurately simulate unconstrained
    pointing and clicking, many common graphical user interface interactions impose geometric
    constraints on cursor motion, where the path taken directly affects interaction outcomes. We
    present a parametrizable generative user simulation model that generates realistic cursor
    trajectories for such tasks by formulating constrained movement as a receding-horizon
    optimization problem using Model Predictive Contouring Control. The model balances speed,
    smoothness, and continuous path and boundary compliance. Evaluation against human data in both
    abstract tunnel steering tasks and realistic interface scenarios, including cascading menus and
    lasso selection, shows that the simulated trajectories closely match human behavior and support
    scalable, trajectory-level analysis of path-sensitive interface designs.
  short_description: >-
    This paper presents a cursor simulation model for interface tasks where the movement path
    matters, using model predictive contouring control to balance speed, smoothness, and geometric
    constraints. Comparisons with human data examine tunnel steering, cascading menus, and lasso
    selection, showing potential for evaluating interface designs while identifying remaining
    differences in movement timing and strategy.
