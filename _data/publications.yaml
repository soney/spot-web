- id: edcode_towards_personalized_support_at_scale_for_remote_assistance_in_cs_education_2020
  title: "EdCode: Towards Personalized Support at Scale for Remote Assistance in CS Education"
  doi: 10.1109/vl/hcc50065.2020.9127260
  abstract: >-
    Programming support methods, like discussion forums and office hours, are important in CS
    education, but difficult to scale. In this paper, we introduce EdCode, a system that allows
    students to seek remote instructional support within their IDE in a way that resembles in-person
    support. It also allows instructors to provide contextualized responses by referencing students’
    code, and curate and publish their answers for an entire class by selecting only the relevant
    part of the code referenced, thereby helping to avoid plagiarism. We evaluated EdCode with a
    series of usability studies and identified benefits and challenges for its use in programming
    courses. Students found that the perceived quality of support from EdCode was comparable to that
    of support from in-person office hours, and both students and instructors found publishing and
    viewing other students’ answers helpful.
  short_description: >-
    EdCode lets programming students request help within their code editor and lets instructors link
    explanations to relevant code, follow up through chat, and share selected answers with the
    class. Usability studies found that students valued the contextual support and could understand
    shared answers even when unrelated code was hidden.
