- id: callisto_capturing_the_why_by_connecting_conversations_with_computational_narratives_2020
  title: "Callisto: Capturing the \"Why\" by Connecting Conversations with Computational Narratives"
  doi: 10.1145/3313831.3376740
  abstract: >-
    When teams of data scientists collaborate on computational notebooks, their discussions often
    contain valuable insight into their design decisions. These discussions not only explain
    analysis in the current notebook but also alternative paths, which are often poorly documented.
    However, these discussions are disconnected from the notebooks for which they could provide
    valuable context. We propose Callisto, an extension to computational notebooks that captures and
    stores contextual links between discussion messages and notebook elements with minimal effort
    from users. Callisto allows notebook readers to better understand the current notebook content
    and the overall problem-solving process that led to it, by making it possible to browse the
    discussions and code history relevant to any part of the notebook. This is particularly helpful
    for onboarding new notebook collaborators to avoid misinterpretations and duplicated work, as we
    found in a two-stage evaluation with 32 data science students.
  short_description: >-
    Callisto connects discussions to notebook cells and their editing history so collaborators can
    recover the reasoning behind a data analysis. In a study with data science students, these links
    helped newcomers understand an ongoing project more accurately, including earlier alternatives
    that no longer appeared in the final notebook.
