- id: expresso_building_responsive_interfaces_with_keyframes_2018
  title: "Expresso: Building Responsive Interfaces with Keyframes"
  doi: 10.1109/vlhcc.2018.8506516
  abstract: >-
    Web developers use responsive web design to create user interfaces that can adapt to many form
    factors. To define responsive pages, developers must use Cascading Style Sheets (CSS) or
    libraries and tools built on top of it. CSS provides high customizability, but requires
    significant experience. As a result, non-programmers and novice programmers generally lack a
    means of easily building custom responsive web pages. In this paper, we present a new approach
    that allows users to create custom responsive user interfaces without writing program code. We
    demonstrate the feasibility and effectiveness of the approach through a new system we built,
    named Expresso. With Expresso, users define “keyframes” — examples of how their UI should look
    for particular viewport sizes — by simply directly manipulating elements in a WYSIWYG editor.
    Expresso uses these keyframes to infer rules about the responsive behavior of elements, and
    automatically renders the appropriate CSS for a given viewport size. To allow users to create
    the desired appearance of their page at all viewport sizes, Expresso lets users define either a
    “smooth” or “jump” transition between adjacent keyframes. We conduct a user study and show that
    participants are able to effectively use Expresso to build realistic responsive interfaces.
  short_description: >-
    Expresso lets users create responsive web interfaces by arranging elements at representative
    viewport sizes and defining transitions between these keyframes. Smooth transitions interpolate
    property values as the viewport changes, while jump transitions create abrupt layout changes,
    allowing custom responsive behavior without writing CSS.
