- id: editrail_understanding_ai_usage_by_visualizing_student_ai_interaction_in_code_2026
  title: "Editrail: Understanding AI Usage by Visualizing Student-AI Interaction in Code"
  abstract: >-
    Programming instructors have diverse philosophies about integrating generative AI into their
    classes. Some encourage students to use AI, while others restrict or forbid it. Regardless of
    their approach, all instructors benefit from understanding how their students actually use AI
    while writing code. Such insight helps instructors assess whether AI use aligns with their
    pedagogical goals, enables timely intervention when they find unproductive usage patterns, and
    establishes effective policies for AI use. However, our survey with programming instructors
    found that many instructors lack visibility into how students use AI in their code-writing
    processes. To address this challenge, we introduce Editrail, an interactive system that enables
    instructors to track students’ AI usage, create personalized assessments, and provide timely
    interventions, all within the workflow of monitoring coding histories. We found that Editrail
    enables instructors to accurately detect AI use that conflicts with pedagogical goals and to
    determine when and which students require intervention.
  short_description: >-
    Editrail visualizes AI contributions alongside students’ code editing histories to help
    instructors understand how students use and adapt generated code. In a comparison study,
    participants identified AI usage patterns more accurately than with the baseline interface and
    used the histories to decide where targeted guidance could help.
