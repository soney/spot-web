- id: cocapture_effectively_communicating_ui_behaviors_on_existing_websites_by_demonstrating_and_remixing_2021
  title: "CoCapture: Effectively Communicating UI Behaviors on Existing Websites by Demonstrating and Remixing"
  doi: 10.1145/3411764.3445573
  abstract: >-
    User Interface (UI) mockups are commonly used as shared context during interface development
    collaboration. In practice, UI designers often use screenshots and sketches to create mockups of
    desired UI behaviors for communication. However, in the later stages of UI development,
    interfaces can be arbitrarily complex, making it labor-intensive to sketch, and static
    screenshots are limited in the types of interactive and dynamic behaviors they can express. We
    introduce CoCapture, a system that allows designers to easily create UI behavior mockups on
    existing web interfaces by demonstrating and remixing, and to accurately describe their requests
    to helpers by referencing the resulting mockups using hypertext. We showed that participants
    could more accurately describe UI behaviors with CoCapture than with existing sketch and
    communication tools and that the resulting descriptions were clear and easy to follow. Our
    approach can help teams develop UIs efficiently by bridging communication gaps with more
    accurate visual context.
  short_description: >-
    CoCapture lets designers communicate changes to an existing website by recording its behavior,
    demonstrating and editing new behavior, and linking written requests to the resulting mockups.
    Study participants described desired UI behavior more accurately than with conventional
    sketching and communication tools, and reviewers found those descriptions easier to follow.
