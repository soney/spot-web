- id: understanding_accessibility_and_collaboration_in_programming_for_people_with_visual_impairments_2021
  title: Understanding Accessibility and Collaboration in Programming for People with Visual Impairments
  doi: 10.1145/3449203
  abstract: >-
    There has been a growing interest in Computer-Supported Cooperative Work and Human-Computer
    Interaction to understand the experiences of programmers in the workplace. However, the large
    majority of these studies has focused on sighted programmers and, as a result, the experiences
    of programmers with visual impairments in professional contexts remain understudied. We address
    this gap by reporting on findings from semi-structured interviews with 22 programmers with
    visual impairments. We found that programmers with visual impairments interact with a complex
    ecosystem of tools and a significant part of their job entails performing work to overcome the
    accessibility challenges inherent in this ecosystem. Furthermore, we find that the visual nature
    of various programming activities impedes collaboration, which necessitates the co-creation of
    new work practices through a series of sociotechnical interactions. These sociotechnical
    interactions often require invisible work and articulation work on the part of the programmers
    with visual impairments.
  short_description: >-
    This interview study examines the workplace experiences of 22 programmers with visual
    impairments, including how they set up tools and collaborate with sighted colleagues. It shows
    that inaccessible software and visually oriented team practices create additional work, from
    developing technical workarounds to explaining access needs and negotiating changes to shared
    workflows.
