- id: making_end_user_development_more_natural_2016
  title: Making End User Development More Natural
  doi: 10.1007/978-3-319-60291-2_1
  abstract: >-
    When end users approach a development task, they bring with them a set of techniques,
    expressions, and knowledge, which can be leveraged in order to make the process easier. The
    Natural Programming Project has been working for over twenty years to better understand how end
    users think about their tasks, and to develop new ways for users to express those tasks that
    will be more “natural,” by which we mean closer to the way they think. Our chapter in the
    previous book covered the first 10 years of this research; and here we summarize the most recent
    10 years. This includes studies on barriers that impede EUD, and a new tool that helps with the
    understanding and debugging barriers by showing developers why their program has its current
    behavior. We also describe a tool that we created to help EUDs input, process, and transform
    data in the context of spreadsheets and web pages. Interaction designers are a class of EUDs
    that may need to program interactive behaviors, so we studied how they naturally express those
    behaviors, and then built a spreadsheet-like tool to allow them to author new behaviors. Another
    spreadsheet tool we created helps EUDs access web service data without writing code, and extends
    the familiar spreadsheet to support analyzing the acquired web-based hierarchical data and
    programming data-driven GUI applications. Finally, EUDs often need to engage in exploratory
    programming, where the goals and tasks are not well-formed in advance. We describe new tools to
    help users selectively undo past actions, along with on-going research to help EUDs create more
    efficient behaviors on smartphones and facilitate variations when performing data analysis.
  short_description: >-
    This chapter reviews a decade of the Natural Programming Project’s work on making development
    tools fit how end users think about their tasks. It covers studies and systems for explaining
    program behavior, handling structured data, authoring interactive interfaces, exploring code
    alternatives, and automating tasks on mobile devices.
  authors:
