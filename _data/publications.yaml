  pdf: pdfs/myers-creativity-support-authoring-chi2013workshoponevaluationmethodsforcreativitysupportenvironments.pdf
  markdown: markdown/myers-creativity-support-authoring-chi2013workshoponevaluationmethodsforcreativitysupportenvironments.md
- id: euclase_a_live_development_environment_with_constraints_and_fsms_2013
  title: "Euclase: A Live Development Environment with Constraints and FSMs"
  doi: 10.1109/live.2013.6617342
  abstract: >-
    Euclase is a live development environment focused on creating interactive web applications. It
    uses a programming model that combines constraints and finite state machines to specify
    interactive behaviors. Euclase is “live” in the sense that while the user is developing code,
    their program is always executing. Changes made to the source of the program are reflected
    immediately in the running program. We identify some of the implementation and design challenges
    of making our development environment live, including performance issues, ensuring
    predictability, dealing with errors in the source, and handling edge cases such as the removal
    of code that is currently running. We also discuss how Euclase’s use of finite state machines
    and constraints can help alleviate these difficulties.
  short_description: >-
    Euclase is a live environment for programming interactive web applications with constraints and
    finite state machines. The paper examines how this model supports immediate feedback while
    addressing implementation and design problems such as localizing errors, updating dependencies,
    and deciding what happens when an active state is deleted.
  authors:
    - steve_oney
    - brad_myers
    - joel_brandt
  student_authors:
    - steve_oney
  venue: live_2013
  pdf: pdfs/oney-euclase-live2013.pdf
  markdown: markdown/oney-euclase-live2013.md
- id: zoomboard_a_diminutive_qwerty_soft_keyboard_using_iterative_zooming_for_ultra_small_devices_2013
  title: "ZoomBoard: A Diminutive QWERTY Soft Keyboard Using Iterative Zooming for Ultra-Small Devices"
  doi: 10.1145/2470654.2481387
  abstract: >-
    The proliferation of touchscreen devices has made soft keyboards a routine part of life.
    However, ultra-small computing platforms like the Sony SmartWatch and Apple iPod Nano lack a
    means of text entry. This limits their potential, despite the fact they are capable computers.
    In this work, we present a soft keyboard interaction technique called ZoomBoard that enables
    text entry on ultra-small devices. Our approach uses iterative zooming to enlarge otherwise
    impossibly tiny keys to comfortable size. We based our design on a QWERTY layout, so that it is
    immediately familiar to users and leverages existing skill. As the ultimate test, we ran a text
    entry experiment on a keyboard measuring just 16 x 6mm – smaller than a US penny. After eight
    practice trials, users achieved an average of 9.3 words per minute, with accuracy comparable to
    a full-sized physical keyboard. This compares favorably to existing mobile text input methods.
  award: honorable_mention
  short_description: >-
    ZoomBoard uses repeated zooming to make a familiar QWERTY keyboard usable on very small
    touchscreens. In a study with six participants using a tiny keyboard displayed on an iPad,
    typing speed reached an average of 9.3 words per minute by the eighth trial, with fewer errors
    than a non-zooming keyboard.
  authors:
    - steve_oney
    - chris_harrison
    - amy_ogan
    - jason_wiese
  student_authors:
    - amy_ogan
    - jason_wiese
    - chris_harrison
    - steve_oney
