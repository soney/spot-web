- id: ui_development_in_mixed_ability_software_engineering_teams_2023
  title: UI Development Experiences of Programmers with Visual Impairments in Product Teams
  doi: 10.1007/978-1-4842-9651-6_8
  short_description: >-
    This chapter synthesizes two studies of how programmers with visual impairments collaborate with
    sighted colleagues on user interface development. It describes barriers in development tools, UI
    frameworks, and team communication, and recommends accessible documentation, nonvisual design
    materials, and work practices that reduce the extra coordination these programmers must perform.
