- id: vizcode_a_practical_real_time_tool_for_in_class_computer_programming_tutoring_2024
  title: "VizCode: A Practical Real-time Tool for In-Class Computer Programming Tutoring"
  doi: 10.1145/3657604.3664716
  abstract: >-
    Prior research has shown the benefits and promise of allowing instructors in large programming
    classes to monitor students’ coding activity in real-time. However, translating these findings
    into practical, user-friendly tools remains a challenge. This demonstration showcases VizCode, a
    tool that allows instructors to monitor students’ code in real-time as they edit in the popular
    Visual Studio Code (VSCode) IDE. VizCode is designed to be practical (integrating with
    widely-used tools and requiring minimal server overhead), scalable (minimizing network latency
    by only communicating code changes), and easy to use (requiring minimal setup from students). By
    focusing on practicality and seamless integration with VSCode, VizCode bridges the gap between
    research and practice, making it easier for instructors to monitor students’ code in real-time.
  short_description: >-
    VizCode lets instructors monitor students’ code as they edit in Visual Studio Code, using a
    dashboard connected to a lightweight data server. This demonstration describes the extension,
    setup process, and incremental transmission of code changes, with an emphasis on fitting
    real-time monitoring into existing programming courses.
