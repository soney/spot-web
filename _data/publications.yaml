- id: a_hybrid_crowd_machine_workflow_for_program_synthesis_2020
  title: A Hybrid Crowd-Machine Workflow for Program Synthesis
  abstract: >-
    Despite advances in machine learning, there has been little progress towards creating automated
    systems that can reliably solve general purpose tasks, such as programming or scripting. In this
    paper, we propose techniques for increasing the reliability of automated systems for program
    synthesis tasks via a hybrid workflow that augments the system with input from crowds of human
    workers. Unlike previous hybrid workflow systems, which have been focused on less complex tasks
    that crowd workers can do in their entirety (e.g., image labeling), our proposed workflow
    handles tasks that untrained crowd workers cannot do alone (i.e., scripting). We evaluate our
    approach by creating BashOn, a system that increases the performance of an automated program
    that generates Bash shell commands from natural language descriptions by ∼30%. Our approach can
    not only help people make program synthesis tools more robust, reliable, and trustworthy for
    end-users to use, but also help lower the cost of downstream data collection for program
    synthesis when a preliminary model exists.
  short_description: >-
    BashOn combines automated shell-command synthesis with crowd workers who identify parts of
    natural language requests and check the outputs of candidate commands. Experiments showed that
    these targeted contributions improved command-generation accuracy over the automated system
    alone, even though the workers lacked Bash expertise, while leaving some requests without a
    returned answer.
