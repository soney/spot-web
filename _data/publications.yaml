- id: redesigning_notebooks_for_data_science_education_2019
  title: Redesigning Notebooks for Data Science Education
  abstract: >-
    Computational notebooks enable data scientists to document their exploration and analysis
    processes through a combination of code, narrative text, visualizations, and other rich media.
    In this position paper, we discuss the opportunities to improve computational notebook
    infrastructure to better support data science education. In particular, we propose to redesign
    computational notebook environments along three dimensions: 1) supporting real-time group
    collaboration, 2) facilitating joint discourse over shared context, and 3) encouraging active
    learning.
  short_description: >-
    This position paper proposes changes to computational notebooks to better support data science
    education through collaboration, discussion, and active learning. It outlines shared editing
    with coordination support, discussions tied to executable notebook content, and replayable
    instructor demonstrations that learners can pause to explore alternatives.
  authors:
