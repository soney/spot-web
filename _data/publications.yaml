- id: understanding_the_challenges_and_needs_of_programmers_writing_web_automation_scripts_2021
  title: Understanding the Challenges and Needs of Programmers Writing Web Automation Scripts
  doi: 10.1109/vl/hcc51201.2021.9576476
  abstract: >-
    For web scraping and task automation purposes, programmers write scripts to interact with
    websites. This is similar to writing end-to-end user interface (UI) test automation suites for
    software, but on third-party websites that the programmer does not own, introducing new
    challenges. A programmer might know what semantic operations they want their script to perform,
    but translating this to code can be difficult. The programmer must investigate the website’s
    internal structure, content, and how UI elements behave, and then write code to click, type, and
    otherwise interact with UI elements. Many tools and frameworks for creating web automation
    scripts exist but the challenges programmers face in using them remains understudied. We
    conducted two studies to study how programmers write web automation scripts. The first study
    focuses on understanding general challenges. The second focuses on the ways website UI context
    and script feedback can be helpful. We also provide a set of design findings that detail the
    kinds of context and feedback developers need while writing web automation scripts.
  short_description: >-
    This paper investigates how programmers write automation scripts for third-party websites
    through two studies, including an evaluation of a prototype editor that shows page context and
    execution feedback. It identifies difficulties selecting elements consistently across pages and
    recommends feedback about selected elements, interaction results, and changes to websites over
    time.
