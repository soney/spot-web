- id: expert_crowd_support_systems_for_software_developers_2016
  title: Expert Crowd Support Systems for Software Developers
  short_description: >-
    This paper investigates how expert crowds could provide programming assistance through three
    studies of requesting help, writing responses, and integrating those responses into code. The
    findings support combining spoken or typed requests with code highlighting and offering
    complementary response formats, including annotations, explanations, and inline code.
