- id: constraintjs_programming_interactive_behaviors_for_the_web_by_integrating_constraints_and_states_2012
  title: "ConstraintJS: Programming Interactive Behaviors for the Web by Integrating Constraints and States"
  doi: 10.1145/2380116.2380146
  abstract: >-
    Interactive behaviors in GUIs are often described in terms of states, transitions, and
    constraints, where the constraints only hold in certain states. These constraints maintain
    relationships among objects, control the graphical layout, and link the user interface to an
    underlying data model. However, no existing Web implementation technology provides direct
    support for all of these, so the code for maintaining constraints and tracking state may end up
    spread across multiple languages and libraries. In this paper we describe ConstraintJS, a system
    that integrates constraints and finite-state machines (FSMs) with Web languages. A key role for
    the FSMs is to enable and disable constraints based on the interface’s current mode, making it
    possible to write constraints that sometimes hold. We illustrate that constraints combined with
    FSMs can be a clearer way of defining many interactive behaviors with a series of examples.
  short_description: >-
    ConstraintJS combines constraints and finite state machines with HTML, CSS, and JavaScript to
    express relationships that change with an interface’s state. Example applications show how this
    approach can coordinate layout, asynchronous data, and interaction behaviors while reducing the
    need for separate event-callback code.
  authors:
    - steve_oney
    - brad_myers
    - joel_brandt
  student_authors:
    - steve_oney
  venue: uist_2012
  pdf: pdfs/oney-constraintjs-uist2012.pdf
  markdown: markdown/oney-constraintjs-uist2012.md
- id: inferring_method_specifications_from_natural_language_api_descriptions_2012
  title: Inferring Method Specifications from Natural Language API Descriptions
  doi: 10.1109/icse.2012.6227137
  abstract: >-
    Application Programming Interface (API) documents are a typical way of describing legal usage of
    reusable software libraries, thus facilitating software reuse. However, even with such
    documents, developers often overlook some documents and build software systems that are
    inconsistent with the legal usage of those libraries. Existing software verification tools
    require formal specifications (such as code contracts), and therefore cannot directly verify the
    legal usage described in natural language text in API documents against code using that library.
    However, in practice, most libraries do not come with formal specifications, thus hindering
    tool-based verification. To address this issue, we propose a novel approach to infer formal
    specifications from natural language text of API documents. Our evaluation results show that our
    approach achieves an average of 92% precision and 93% recall in identifying sentences that
    describe code contracts from more than 2500 sentences of API documents. Furthermore, our results
    show that our approach has an average 83% accuracy in inferring specifications from over 1600
    sentences describing code contracts.
  short_description: >-
    This paper presents a method for turning natural language API descriptions into formal code
    contracts. In an evaluation of C# file-system and Facebook API documentation, it identified
    contract sentences with about 92% precision and 93% recall, then inferred their specifications
    with about 83% accuracy.
  authors:
    - rahul_pandita
    - xusheng_xiao
    - hao_zhong
    - tao_xie
