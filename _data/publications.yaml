- id: expressing_interactivity_with_states_and_constraints_2015
  title: Expressing Interactivity with States and Constraints
  abstract: >-
    A Graphical User Interface (GUI) is defined by its appearance and its behavior. A GUI’s behavior
    determines how it reacts to user and system events such as mouse, keyboard, or touchscreen
    presses, or changes to an underlying data model. Although many tools are effective in enabling
    designers to specify a GUI’s appearance, defining a custom behavior is difficult and
    error-prone. Many of the difficulties developers face in defining GUI behaviors are the result
    of their reactive nature. The order in which GUI code is executed depends upon the order in
    which it receives external inputs. Most widely used user interface programming frameworks use an
    event-callback model, where developers define GUI behavior by defining callbacks—sequences of
    low-level actions—to take in reaction to events. However, the event-callback model for
    user-interface development has several problems, many of which have been identified long before
    I started work on this dissertation. First, it is disorganized: the location and order of
    event-callback code often has little correspondence with the order in which it will be executed.
    Second, it divides GUI code in a way that requires writing interdependent code to keep the
    interface in a consistent state. This is because maintaining a consistent state requires
    referencing and modifying the same state variables across multiple different callbacks, which
    are often distributed throughout the code. In this dissertation, I will introduce a new
    framework for defining GUI behavior, called the state-constraint framework. This framework
    combines constraints—which allow developers to define relationships among interface elements
    that are automatically maintained by the system—and state machines—which track the status of an
    interface. In the state-constraint framework, developers write GUI behavior by defining
    constraints that are enforced when the interface is in specific states. This framework allows
    developers to specify more nuanced constraints and allows the GUI’s appearance and behavior to
    vary by state. I created two tools using the state-constraint framework: a library for Web
    developers (ConstraintJS) and an interactive graphical language (InterState). ConstraintJS
    provides constraints that can be used both to control content and control display, and
    integrates these constraints with the three Web languages—HTML, CSS, and JavaScript.
    ConstraintJS is designed to take advantage of the declarative syntaxes of HTML and CSS: It
    allows the majority of an interactive behavior to be expressed concisely in HTML and CSS, rather
    than requiring the programmer to write large amounts of JavaScript. InterState introduces a
    visual notation and live editor to clearly represent how states and constraints combine to
    define GUI behavior. An evaluation of InterState showed that its computational model, visual
    notation, and editor were effective in allowing developers to define GUI behavior compared to
    conventional event-callback code. InterState also introduces extensions to the state-constraint
    framework to allow developers to easily re-use behaviors and primitives for authoring
    multi-touch gestures.
  short_description: >-
    This dissertation develops the state-constraint framework for defining interface behavior
    through relationships that apply in specific states. It implements the approach in ConstraintJS
    and InterState, evaluates InterState against event-callback programming, and extends the
    framework with reusable behaviors, custom events, and primitives for multi-touch gestures.
  authors:
    - steve_oney
  student_authors:
    - steve_oney
  venue: cmu_2015
  pdf: pdfs/oney-expressing-interactivity-states-cmu2015.pdf
  markdown: markdown/oney-expressing-interactivity-states-cmu2015.md
- id: interstate_a_language_and_environment_for_expressing_interface_behavior_2014
  title: "InterState: A Language and Environment for Expressing Interface Behavior"
  doi: 10.1145/2642918.2647358
  abstract: >-
    InterState is a new programming language and environment that addresses the challenges of
    writing and reusing user interface code. InterState represents interactive behaviors clearly and
    concisely using a combination of novel forms of state machines and constraints. It also
    introduces new language features that allow programmers to easily modularize and reuse
    behaviors. InterState uses a new visual notation that allows programmers to better understand
    and navigate their code. InterState also includes a live editor that immediately updates the
    running application in response to changes in the editor and vice versa to help programmers
    understand the state of their program. Finally, InterState can interface with code and widgets
    written in other languages, for example to create a user interface in InterState that
    communicates with a database. We evaluated the understandability of InterState’s programming
    primitives in a comparative laboratory study. We found that participants were twice as fast at
    understanding and modifying GUI components when they were implemented with InterState than when
    they were implemented in a conventional textual event-callback style. We evaluated InterState’s
    scalability with a series of benchmarks and example applications and found that it can scale to
    implement complex behaviors involving thousands of objects and constraints.
  short_description: >-
    InterState combines state machines, constraints, and a live visual editor to help programmers
    write and reuse user interface behaviors. In a study with 20 experienced programmers,
    participants completed two interface modification tasks in roughly half the time required with
    conventional JavaScript event-callback code.
  authors:
    - steve_oney
    - brad_myers
    - joel_brandt
  student_authors:
    - steve_oney
  venue: uist_2014
  pdf: pdfs/oney-interstate-uist2014.pdf
  markdown: markdown/oney-interstate-uist2014.md
- id: creativity_support_in_authoring_and_backtracking_2013
  title: Creativity Support in Authoring and Backtracking
  abstract: >-
    The “Natural Programming” group has been working for 15 years on making it easier for all kinds
    of programmers to be creative when writing software. Recently, one focus has been enabling
    “end-user programmers” (EUPs) such as interaction designers to more easily author interactive
    behaviors for the web. In a separate project, we are adding features to a code editor to support
    “backtracking” — undoing operations to partially or fully restore the code to a previous state —
    since creative exploration usually involves both moving forward to new designs and going
    backwards to retract some or all of the design that is not desired. In all of these projects, we
    seek to measure both the usability of our tools, and their effectiveness at fostering
    creativity.
  short_description: >-
    This workshop paper examines how development tools can support creative exploration when
    programmers build new behaviors and undo unwanted changes. It discusses the Euclase authoring
    environment and Azurite’s selective undo tools, and identifies the need for better ways to
    measure their effects on creativity.
  authors:
    - brad_myers
    - steve_oney
    - youngseok_yoon
    - joel_brandt
  student_authors:
