  venue: chi_2010
  pdf: pdfs/ozenc-how-support-designers-chi2010.pdf
  markdown: markdown/ozenc-how-support-designers-chi2010.md
- id: empowering_designers_with_creativity_support_tools_2009
  title: Empowering Designers with Creativity Support Tools
  doi: 10.1109/vlhcc.2009.5295244
  abstract: >-
    When conceiving of and implementing interactive behaviors, most designers rely on professional
    software developers to prototype and implement their designs. They often use static drawings or
    animations to convey how their application should work. While these drawings are effective in
    conveying the look of an application, they do not effectively communicate its feel. In addition,
    other barriers prevent many interaction designers from taking full advantage of computational
    tools. We plan to address this by building a new development language and environment especially
    suited for creating and prototyping interactive applications. In this paper, several related
    studies and their implications for the design of such a language are discussed.
  short_description: >-
    This doctoral consortium paper outlines the Euclase project’s goal of helping interaction
    designers prototype their own interactive applications. Drawing on related studies and a
    participatory workshop, it identifies needs for sharing context, preserving design alternatives,
    reusing examples, and communicating which parts of a design remain open to change.
  authors:
    - steve_oney
  student_authors:
    - steve_oney
  venue: vl_hcc_gc_2009
  pdf: pdfs/oney-empowering-designers-creativity-vlhccgc2009.pdf
