- id: cflow_supporting_semantic_flow_analysis_of_students_code_in_programming_problems_at_scale_2024
  title: "CFlow: Supporting Semantic Flow Analysis of Students' Code in Programming Problems at Scale"
  doi: 10.1145/3657604.3662025
  abstract: >-
    Introductory programming courses have been growing rapidly, now enrolling hundreds or thousands
    of students. In such large courses, it can be overwhelmingly difficult for instructors to
    understand class-wide problem-solving patterns or issues, which is crucial for improving
    instruction and addressing important pedagogical challenges. In this paper, we propose a
    technique and system, CFlow, for creating understandable and navigable representations of code
    at scale. CFlow is able to represent thousands of code samples in a visualization that resembles
    a single code sample. CFlow creates scalable code representations by (1) clustering individual
    statements with similar semantic purposes, (2) presenting clustered statements in a way that
    maintains semantic relationships between statements, (3) representing the correctness of
    different variations as a histogram, and (4) allowing users to navigate through solutions
    interactively using semantic filters. With a multi-level view design, users can navigate
    high-level patterns, and low-level implementations. This is in contrast to prior tools that
    either limit their focus on isolated statements (and thus discard the surrounding context of
    those statements) or cluster entire code samples (which can lead to large numbers of
    clusters—for example, if there are n code features and m implementations of each, there can be
    m^n clusters). We evaluated the effectiveness of CFlow with a comparison study, found
    participants using CFlow spent only half the time identifying mistakes and recalled twice as
    many desired patterns from over 6,000 submissions.
  short_description: >-
    CFlow helps instructors compare large collections of student programs through groups of
    semantically related statements, aligned code views, and visual summaries of common mistakes. In
    a study with 16 participants analyzing more than 6,000 submissions, participants answered
    questions about mistakes and patterns faster and identified more valid mistakes than with the
    baseline system.
