- id: natural_language_search_of_structured_documents_2008
  title: Natural Language Search of Structured Documents
  abstract: >-
    This thesis focuses on techniques with which natural language can be used to search for specific
    elements in a structured document, such as an XML file. The goal is to create a system capable
    of being trained to identify features of a written English sentence describing (in natural
    language) part of an XML document, that help identify the sections of said document which were
    discussed. In particular, this thesis will revolve around the problem of searching through XML
    documents, each of which describes the play-by-play events of a baseball game. These events are
    collected from Major League Baseball games between 2004 and 2008, containing information
    detailing the outcome of every pitch thrown. My techniques are trained and tested on written
    (newspaper) summaries of these games, which often refer to specific game events and statistics.
    The choice of these training data makes the task much more complex in two ways. First, these
    summaries come from multiple authors. Each of these authors has a distinct writing style, which
    uses language in a unique and often complex way. Secondly, large portions of these summaries
    discuss facts outside of the context of the play-by-play events of the XML documents. Training
    the system with these portions of the summary can create a problem due to sparse data, which has
    the potential to reduce the effectiveness of the system. The end result is the creation of a
    system capable of building classifiers for natural language search of these XML documents. This
    system is able to overcome the two aforementioned problems, as well as several more subtle
    challenges. In addition, several limitations of alternative, strictly feature-based, classifiers
    are also illustrated, and applications of this research to related problems (outside of baseball
    and sports) are discussed.
  short_description: >-
    This thesis studies how sentences in baseball game reports can be matched to events in
    structured XML game records. It compares feature-based classifiers with a probabilistic model
    inspired by translation, showing how event context and estimates of the number of events
    mentioned can support natural language search.
  authors:
    - steve_oney
  student_authors:
    - steve_oney
  venue: mit_2008
  pdf: pdfs/oney-natural-language-search-mit2008.pdf
  markdown: markdown/oney-natural-language-search-mit2008.md
