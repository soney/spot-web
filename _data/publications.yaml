- id: towards_providing_on_demand_expert_support_for_software_developers_2016
  title: Towards Providing On-Demand Expert Support for Software Developers
  doi: 10.1145/2858036.2858512
  abstract: >-
    Software development is an expert task that requires complex reasoning and the ability to recall
    language or API-specific details. In practice, developers often seek support from IDE tools, Web
    resources, or other developers to help fill in gaps in their knowledge on-demand. In this paper,
    we present two studies that seek to inform the design of future systems that use remote experts
    to support developers on demand. The first explores what types of questions developers would ask
    a hypothetical assistant capable of answering any question they pose. The second study explores
    the interactions between developers and remote “experts” in supporting roles. Our results
    suggest eight key system features needed for on-demand remote developer assistants to be
    effective, which has implications for future human-powered development tools.
  short_description: >-
    This paper reports two studies of the support developers want from remote experts: requests to
    an imagined ideal assistant and collaboration with human helpers. The findings identify eight
    requirements for future support tools, including sharing code context, responding promptly, and
    tailoring help to the developer’s goals.
