- id: on_demand_collaboration_in_programming_2020
  title: On-Demand Collaboration in Programming
  abstract: >-
    Many teams have shifted to online remote collaboration as a result of COVID-19, from
    professional development teams to programming classes to computing-related workspaces (e.g.,
    makerspaces). This paper explores on-demand remote help seeking in programming, a type of
    collaboration that occurs when developers seek online support for their tasks as needed, and
    argues that a key challenge in scaling remote on-demand collaboration in programming is to
    facilitate effective context capturing and workforce coordination. Traditionally, this
    collaboration happens within teams and organizations where people are familiar with the context
    of the tasks. Recently, this collaboration has become ubiquitous due to the success of paid
    online crowdsourcing marketplaces (e.g., Upwork) and Q&A sites (e.g., Stack Overflow). We
    discuss prior work on on-demand collaboration in programming, analyze how the idea can be tested
    in physical computing as well, and examine existing and new challenges that should be further
    explored.
  short_description: >-
    This position paper examines how developers can request programming help from remote experts as
    needed, drawing on prior work in software collaboration and physical computing. It identifies
    capturing task context and coordinating helpers as central challenges, especially when
    collaborators need to understand or manipulate physical devices remotely.
