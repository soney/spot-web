  venue: icse_2012
  pdf: pdfs/pandita-inferring-method-specifications-icse2012.pdf
  markdown: markdown/pandita-inferring-method-specifications-icse2012.md
- id: development_tools_for_interactive_behaviors_2011
  title: Development Tools for Interactive Behaviors
  doi: 10.1007/978-3-642-21530-8_49
  abstract: >-
    This research uses participatory design workshops and user-centered design with trained
    interaction designers to guide the development of a new programming language and environment for
    creating interactive applications. Interactive behaviors, which define the operation of an
    interactive application, are often difficult for interaction designers to program because many
    interaction designers do not have formal programming training and many features of interactive
    behaviors make the task of programming them distinct from, and often more challenging than,
    other programming tasks. This research aims to create a programming language and environment
    that is tailored to the needs of interaction designers and that alleviates the problems that
    make programming interactive behaviors difficult.
  short_description: >-
    This doctoral consortium paper describes a research program to make programming interactive
    behaviors more approachable for interaction designers. Informed by participatory workshops, its
    early prototype represents properties and event-dependent constraints in a table and provides
    immediate feedback, which designers used to experiment during initial testing.
  authors:
    - steve_oney
  student_authors:
    - steve_oney
  venue: is_eud_dc_2011
  pdf: pdfs/oney-development-tools-interactive-iseuddc2011.pdf
  markdown: markdown/oney-development-tools-interactive-iseuddc2011.md
- id: playbook_revision_control_comparison_for_interactive_mockups_2011
  title: "Playbook: Revision Control & Comparison for Interactive Mockups"
  abstract: >-
    When designing interactive interfaces and behaviors, interface designers compare and contrast
    multiple design ideas, often creating and testing many intermediate user interface prototypes
    before deciding on a final design. However, existing interface prototyping and creation tools do
    not effectively let designers explore, compare, or keep track of older versions of interface
    mockups, implicitly making the assumption that the users of these tools will work with one
    design alternative at a time. To explore how to enable designers to work with multiple designs
    in a prototyping tool, we created Playbook, a new system oriented towards helping interface
    designers keep track of, compare, and create interactive mockups. In this paper, we describe
    Playbook and discuss ways that future prototyping tools can better support the workflow of
    designers.
  short_description: >-
    Playbook helps interface designers keep versions of interactive mockups created from layered
    Photoshop files and simple behavior scripts. Designers can compare alternatives side by side by
    mapping equivalent actions and responses, allowing a single interaction to drive multiple
    mockups even when their interfaces differ.
  authors:
