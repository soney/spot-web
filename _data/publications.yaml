- id: attention_patterns_for_code_animations_using_eye_trackers_to_evaluate_dynamic_code_presentation_techniques_2018
  title: "Attention Patterns for Code Animations: Using Eye Trackers to Evaluate Dynamic Code Presentation Techniques"
  doi: 10.1145/3191697.3214338
  abstract: >-
    Programming instructors seek new ways to present code to novice programmers. It is important to
    understand how these new presentation methods affect students. We prototyped three different
    ways to animate the presentation of code. We used eye-tracking technology to observe
    participants as they were presented with animations and completed three activities: code
    summarization, syntax error correction, and logic error correction. The prototypes, our method
    for observation, and our analysis methods were each informed by previous research. We observed
    variation in how participants consumed animations. Our initial results indicate that viewing
    animations of a single textual representation of source code may affect the attentional
    processes of novice programmers during subsequent tasks.
  short_description: >-
    This exploratory study uses eye tracking to examine how novice programmers view three forms of
    code animation and then summarize or debug the code. The preliminary results show varied viewing
    strategies and suggest that animations can affect later attention patterns, providing directions
    for further evaluation of code presentation techniques.
