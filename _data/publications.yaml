- id: edbooks_ai_enhanced_interactive_narratives_for_programming_education_2024
  title: "EDBooks: AI-Enhanced Interactive Narratives for Programming Education"
  abstract: >-
    Large Language Models (LLMs) have shown the potential to be valuable teaching tools, with the
    potential of giving every student a personalized tutor. However, one challenge with using LLMs
    to learn new concepts is that when learning a topic in an unfamiliar domain, it can be difficult
    to know what questions to ask. Further, language models do not always encourage “active
    learning” where students can test and assess their understanding. In this paper, we propose ways
    to combine large language models with “traditional” learning materials (like e-books) to give
    readers the benefits of working with LLMs (the ability to ask personally interesting questions
    and receive personalized answers) with the benefits of a traditional e-book (having a structure
    and content that is pedagogically sound). This work shows one way that LLMs have the potential
    to improve learning materials and make personalized programming education more accessible to a
    broader audience.
  short_description: >-
    EDBooks combines authored dialog trees, interactive coding exercises, and open-ended AI
    conversations to support programming learners within structured educational materials. In a
    study with 20 learners, participants engaged more with the integrated materials than with a
    conventional tutorial plus ChatGPT, though assessment scores did not improve significantly.
  authors:
    - steve_oney
