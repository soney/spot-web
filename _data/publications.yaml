- id: vrcopilot_authoring_3d_layouts_with_generative_models_in_vr_2024
  title: "VRCopilot: Authoring 3D Layouts with Generative Models in VR"
  doi: 10.1145/3654777.3676451
  abstract: >-
    Immersive authoring provides an intuitive medium for users to create 3D scenes via direct
    manipulation in Virtual Reality (VR). Recent advances in generative AI have enabled the
    automatic creation of realistic 3D layouts. However, it is unclear how capabilities of
    generative AI can be used in immersive authoring to support fluid interactions, user agency, and
    creativity. We introduce VRCopilot, a mixed-initiative system that integrates pre-trained
    generative AI models into immersive authoring to facilitate human-AI co-creation in VR.
    VRCopilot presents multimodal interactions to support rapid prototyping and iterations with AI,
    and intermediate representations such as wireframes to augment user controllability over the
    created content. Through a series of user studies, we evaluated the potential and challenges in
    manual, scaffolded, and automatic creation in immersive authoring. We found that scaffolded
    creation using wireframes enhanced the user agency compared to automatic creation. We also found
    that manual creation via multimodal specification offers the highest sense of creativity and
    agency.
  short_description: >-
    VRCopilot combines generative AI, speech and pointing, and editable wireframes to help users
    create room layouts in virtual reality. Its studies found that wireframe-based creation
    supported greater perceived agency than automatic generation, while manual creation through
    multimodal specification offered the strongest sense of creativity and control.
