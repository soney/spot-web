  pdf: pdfs/oney-edbooks-preprint2024.pdf
  markdown: markdown/oney-edbooks-preprint2024.md
- id: improving_advising_relationships_between_phd_students_and_faculty_in_human_computer_interaction_2024
  title: Improving Advising Relationships Between PhD Students and Faculty in Human-Computer Interaction
  doi: 10.1145/3613905.3643971
  abstract: >-
    Advisor-advisee relationships between PhD students and faculty are vital to research, but
    advising dynamics can be challenging for both student and advisor. Though advising can involve
    egregious problems such as sexual harassment, we focus on what might be less serious but more
    common issues such as exploitation, unprofessional behavior, mishandling of credit, and
    inadequate communication. While problems can be caused by advisor or advisee, the power
    imbalance exacerbates problems for PhD students. In any case, open discussion about PhD advising
    is rare. In this panel, we hope to start a much-needed conversation about PhD advising to raise
    awareness within the SIGCHI community about common advising problems; and to begin brainstorming
    solutions that faculty, administrators, and PhD students can implement.
  short_description: >-
    This panel proposal examines problems in PhD advising relationships within human–computer
    interaction, including communication failures, exploitation, disputed credit, and power
    imbalances. It outlines a discussion involving student and faculty perspectives to raise
    awareness and consider changes that students, advisors, and institutions could make.
