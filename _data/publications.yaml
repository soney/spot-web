- id: firecrystal_understanding_interactive_behaviors_in_dynamic_web_pages_2009
  title: "FireCrystal: Understanding Interactive Behaviors in Dynamic Web Pages"
  doi: 10.1109/vlhcc.2009.5295287
  abstract: >-
    For developers debugging their own code, augmenting the code of others, or trying to learn the
    implementation details of interactive behaviors, understanding how web pages work is a
    fundamental problem. FireCrystal is a new Firefox extension that allows developers to indicate
    interactive behaviors of interest, and shows the specific code (Javascript, CSS, and HTML) that
    is responsible for those behaviors. FireCrystal provides an execution timeline that users can
    scrub back and forth, and the ability to select items of interest in the actual web page UI to
    see the associated code. FireCrystal may be especially useful for developers who are trying to
    learn the implementation details of interactive behaviors, so they can reuse these behaviors in
    their own web site.
  short_description: >-
    FireCrystal is a Firefox extension for recording and inspecting interactive behavior in web
    pages. Its replay timeline lets developers revisit visible changes, select elements of interest,
    and inspect associated HTML, CSS, and JavaScript, using execution history to help locate
    potentially relevant code for understanding and reuse.
  authors:
    - steve_oney
    - brad_myers
  student_authors:
    - steve_oney
  venue: vl_hcc_2009
  pdf: pdfs/oney-firecrystal-vlhcc2009.pdf
  markdown: markdown/oney-firecrystal-vlhcc2009.md
- id: visions_for_euclase_ideas_for_supporting_creativity_through_better_prototyping_of_behaviors_2009
  title: "Visions for Euclase: Ideas for Supporting Creativity through Better Prototyping of Behaviors"
  abstract: >-
    Our research is investigating how to allow designers and other creative professionals to easily
    prototype and create interactive computer applications and web sites. In this paper, we discuss
    several studies we have conducted to better understand the requirements of an environment to
    support the authoring of interactive behaviors by creative professionals. Then we detail our
    proposals for a new environment that tries to address those requirements. This environment would
    include the ability to explore multiple designs, support for collaboration, and the use of
    metaphors that better support the creative process. Finally, this paper poses questions related
    to computational support of creativity.
  short_description: >-
    This workshop paper proposes Euclase, an environment intended to help designers create
    interactive behaviors without relying on professional programmers. Drawing on studies of
    designers’ needs, it outlines support for comparing alternatives, reusing examples,
    communicating design rationale, and debugging during exploration, while posing questions about
    how these features might support creativity.
  authors:
