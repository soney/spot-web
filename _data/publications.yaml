- id: democratizing_computational_tools_for_interaction_designers_2010
  title: Democratizing Computational Tools for Interaction Designers
  doi: 10.1109/vlhcc.2010.43
  abstract: >-
    I am creating a new programming language and editor that is aimed towards authoring interactive
    behaviors. This language is intended to allow more interaction designers to write their own
    interactive applications. This paper discusses the motivation, method, and design ideas for such
    a language.
  short_description: >-
    This doctoral consortium paper proposes a programming language and editor tailored to
    interaction designers who want to implement their own interface behaviors. It explores combining
    spreadsheet, state-machine, and timeline views with immediate feedback and localized behaviors
    to make custom interactions easier to understand and revise.
  authors:
    - steve_oney
  student_authors:
    - steve_oney
  venue: vl_hcc_gc_2010
  pdf: pdfs/oney-democratizing-computational-tools-vlhccgc2010.pdf
  markdown: markdown/oney-democratizing-computational-tools-vlhccgc2010.md
- id: how_to_support_designers_in_getting_hold_of_the_immaterial_material_of_software_2010
  title: How to Support Designers in Getting Hold of the Immaterial Material of Software
  doi: 10.1145/1753326.1753707
  abstract: >-
    When designing novel GUI controls, interaction designers are challenged by the “immaterial”
    materiality of the digital domain; they lack tools that effectively support a reflecting
    conversation with the material of software as they attempt to conceive, refine, and communicate
    their ideas. To investigate this situation, we conducted two participatory design workshops. In
    the first workshop, focused on conceiving, we observed that designers want to invent controls by
    exploring gestures, context, and examples. In the second workshop, on refining and
    communicating, designers proposed tools that could refine movement, document context through
    usage scenarios, and support the use of examples. In this workshop they struggled to effectively
    communicate their ideas to developers because their ideas had not been fully explored. In
    reflecting on this struggle, we began to see an opportunity for the output of a design tool to
    be a boundary object that would allow for an ongoing conversation between the design and the
    material of software, in which the developer acts as a mediator for software.
  short_description: >-
    This paper reports two participatory design workshops on how interaction designers conceive,
    refine, and communicate novel interface controls. The findings motivate tools that preserve
    gestures, examples, usage scenarios, and design rationale so designers and developers can
    continue refining an interaction together instead of treating static sketches as complete
    specifications.
  authors:
