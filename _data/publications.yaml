- id: scrapeviz_hierarchical_representations_for_web_scraping_macros_2024
  title: "ScrapeViz: Hierarchical Representations for Web Scraping Macros"
  doi: 10.1109/vl/hcc60511.2024.00040
  abstract: >-
    Programming-by-demonstration (PBD) makes it possible to create web scraping macros without
    writing code. However, it can still be challenging for users to understand the exact scraping
    behavior that is inferred and to verify that the scraped data is correct, especially when
    scraping occurs across multiple pages. We present ScrapeViz, a new PBD tool for authoring and
    visualizing hierarchical web scraping macros. ScrapeViz’s key novelty is in providing a visual
    representation of web scraping macros—the sequences of pages visited, generalized scraping
    behavior across similar pages, and data provenance. We conducted a lab study with 12
    participants comparing ScrapeViz to the existing web scraping tool Rousillon and saw that
    participants found ScrapeViz helpful for understanding high-level scraping behavior, tracing the
    source of scraped data, identifying anomalies, and validating macros while authoring.
  short_description: >-
    ScrapeViz lets users create web scraping macros by demonstration and inspect their behavior
    through a hierarchical visual storyboard. In a study with 12 participants, its linked page views
    and output table helped users trace scraped data, identify anomalies, and check macros while
    authoring.
