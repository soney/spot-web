overview: >-
  We are a research group at the [University of Michigan](https://umich.edu/), primarily in the [School of
  Information](https://www.si.umich.edu/) and [Computer Science](https://cse.engin.umich.edu/). Our research focuses on
  understanding the factors that make programming tools usable and designing & building new tools for programmers and people learning to program.
joining: >-
  We are always excited to work with motivated and talented students.


  **Ph.D.:** Please read [our group's guide for Ph.D. applicants](https://from.so/writing/SPOT_PhD_Application_Guide/)


  **Masters, Bachelors, and High School students:** If you are interested in collaborating with our research group,
  please [fill out this
  form](https://docs.google.com/forms/d/e/1FAIpQLSczLxUU_KbmKnGcl1QsCeiDXaplQa5KWehoVl6P3s0EzmcQtA/viewform?usp=sf_link).
  When you do, it will email the current members of the team so that we can see if there are any potentially matching
  projects. If you are unable to fill out that form for any reason, please reach out to
  [soney@umich.edu](mailto:soney@umich.edu).
recent_pub_cutoff_year: 2020
announcement: ""

