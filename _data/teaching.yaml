# Courses taught, in display order (newest first).
#
# This is the single source behind two places: the CV's Teaching section
# (_includes/cv_body.html) and the Teaching section on a person page
# (_layouts/person.html). Add a course once and it appears in both. It lives
# here rather than in a _data/cvs/<person_id>.yaml -- which is one person's
# CV -- for the same reason publications do: it is shared data that the CV
# filters, not CV-only material.
#
# `person` is a people.yaml id, and it is what both templates filter on. A typo
# is silent: the entry renders nowhere.
#
# A CV is exhaustive and a homepage is not, so two things keep an entry off the
# person page while leaving it on the CV:
#
#   page_since     the cutoff below: an entry whose last year is earlier stays
#                  on the CV only. An entry still running (`date_end: present`)
#                  is never cut, whenever it started.
#   cv_only: true  a per-entry opt-out, for something recent that the page
#                  should not list anyway.
#
# Both are applied by _plugins/teaching_entries.rb, which reads the years out
# of the date strings ("Fall 2007 & Spring 2008") that Liquid cannot parse.

# 2016 is the first Michigan course, so this cuts the CMU and MIT teaching and
# nothing else. It is the coarse net; `cv_only: true` on a record is how to
# hold back something inside the window.
page_since: 2016

