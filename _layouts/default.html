<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% feed_meta %}
</head>

<body>
  <div class="application">
    <div class="container">
      <a class="d-block skip-to-content-link" href="#content">Skip to main content</a>
    </div>
    <nav class="navbar navbar-expand">
      <div class="container">
        <a class="navbar-brand{% if page.nav == 'home' %} active{% endif %}"
          href="{{ '/' | relative_url }}">{{ site.brand }}</a>
        <div class="navbar-collapse">
          <ul class="navbar-nav">
            {% for tab in site.data.nav %}
            <li class="nav-item{% if page.nav == tab.key %} active{% endif %}">
              <a class="nav-link" href="{{ tab.url | relative_url }}">{{ tab.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
        {% if page.back_url %}
        <a class="nav-link nav-back ms-auto" href="{{ page.back_url | relative_url }}">&larr; {{ page.back_label }}</a>
        {% endif %}
      </div>
    </nav>

    <main id="content" role="main" class="page-content">
      {{ content }}
    </main>
  </div>
</body>

</html>
