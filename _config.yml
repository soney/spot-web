title: SPOT Research Group
brand: spot
email: soney@umich.edu
description: Human-centered research on programming tools and practices.
baseurl: ""
url: "https://from.so"

# Which venue types appear in the site's publication lists (homepage,
# /research, person pages). The CV uses its own, longer list from
# _data/cv_publication_sections.yaml.
publication_list_types:
  - conference
  - journal

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
plugins:
  - jekyll-feed

# Jekyll already excludes Gemfile*, node_modules, vendor, and dotfiles by
# default; this list only needs what those defaults miss. CNAME must NOT be
# excluded — it has to be copied into _site for the custom domain to survive
# a gh-pages deploy.
exclude:
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
