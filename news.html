<div class="container news">
  <h1>News</h1>
  {% comment %} sort places undated items first, so reverse puts them last {% endcomment %}
  {% assign all_news = site.data.news | sort: "date" | reverse %}
  <ul class="news-list">
    {% for item in all_news %}
    {% include news_item.html item=item %}
    {% endfor %}
  </ul>
</div>
